<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ฝึกเขียนคันจิ</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* playful game-app palette: sunny cream + teal brand + coral CTA */
            --bg: #fff6e4;
            --card: #ffffff;
            --ink: #2b2140;
            --ink-soft: #6b5f84;
            --brand: #17a398;
            --brand-deep: #0e7a6e;
            --pop: #ff6b4a;
            --pop-deep: #d8542f;
            --success: #3eaa5c;
            --success-deep: #2c8548;
            --error: #e64545;
            --error-deep: #b93434;
            --sand: #ffe8b8;
            --line: #f0dfb8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background:
                radial-gradient(circle at 8% 0%, rgba(23, 163, 152, 0.16), transparent 42%),
                radial-gradient(circle at 96% 100%, rgba(255, 107, 74, 0.16), transparent 46%),
                var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--ink);
        }

        header {
            background: var(--bg);
            padding: 16px 16px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 6px 12px -8px rgba(43, 33, 64, 0.18);
        }

        .brand-row {
            max-width: 460px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-row .kanji-mark {
            width: 38px;
            height: 38px;
            flex: none;
            border-radius: 12px;
            background: var(--pop);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.15rem;
            box-shadow: 0 3px 0 var(--pop-deep);
        }

        .brand-row .brand-text {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--ink);
        }

        .progress-row {
            max-width: 460px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-track {
            flex: 1;
            height: 12px;
            background: var(--sand);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--brand);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .progress-count {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--ink-soft);
            min-width: 34px;
            text-align: right;
        }

        .nav-container {
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-group label {
            font-size: 0.78rem;
            font-weight: 600;
            min-width: 74px;
            color: var(--ink-soft);
        }

        select {
            flex: 1;
            padding: 9px 14px;
            border: 2px solid var(--line);
            border-radius: 999px;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 600;
            background: var(--card);
            color: var(--ink);
            outline: none;
            cursor: pointer;
        }

        select:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--brand);
            outline-offset: 2px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 14px 30px;
        }

        .card {
            background: var(--card);
            width: 100%;
            max-width: 440px;
            padding: 24px 20px 22px;
            border-radius: 28px;
            box-shadow: 0 1px 0 var(--line), 0 16px 34px -20px rgba(43, 33, 64, 0.45);
            text-align: center;
        }

        .info-section {
            margin-bottom: 16px;
        }

        .meaning-badge {
            display: inline-block;
            background: var(--sand);
            color: var(--pop-deep);
            font-weight: 800;
            font-size: 1.35rem;
            padding: 6px 20px;
            border-radius: 999px;
        }

        .reading-hint {
            display: block;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--ink-soft);
            margin-top: 10px;
        }

        /* practice canvas: dashed centerline target instead of literal manuscript grid,
           reads as a game "drop zone" while still giving a stroke-alignment guide */
        #writer-container {
            width: 78vw;
            height: 78vw;
            max-width: 320px;
            max-height: 320px;
            margin: 0 auto 18px auto;
            background: #fffdf7;
            border: 3px solid var(--brand);
            border-radius: 24px;
            position: relative;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 5px 0 var(--brand-deep);
        }

        #writer-container::before {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 14px;
            background-image:
                linear-gradient(90deg, transparent 49%, var(--line) 50%, transparent 51%),
                linear-gradient(180deg, transparent 49%, var(--line) 50%, transparent 51%);
            background-size: 100% 100%;
            opacity: 0.9;
            pointer-events: none;
            z-index: 0;
        }

        #writer-container svg {
            position: relative;
            z-index: 1;
        }

        .status-chip {
            display: inline-block;
            min-width: 180px;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 18px;
            border-radius: 999px;
            margin-bottom: 16px;
            background: var(--sand);
            color: var(--ink-soft);
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .status-chip.state-success {
            background: #dff3e4;
            color: var(--success-deep);
        }

        .status-chip.state-error {
            background: #fbdede;
            color: var(--error-deep);
        }

        .status-chip.state-info {
            background: #d9f0ee;
            color: var(--brand-deep);
        }

        .status-chip.pop {
            animation: chip-pop 0.35s ease;
        }

        @keyframes chip-pop {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        .actions {
            display: grid;
            grid-template-columns: auto 1fr 1.3fr;
            gap: 10px;
        }

        button {
            padding: 14px 12px;
            border: none;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .btn-prev {
            background: var(--card);
            color: var(--brand-deep);
            border: 2px solid var(--line);
            padding-left: 16px;
            padding-right: 16px;
            box-shadow: 0 4px 0 var(--line);
        }

        .btn-hint {
            background: #eaf6f4;
            color: var(--brand-deep);
            box-shadow: 0 4px 0 #c7e6e1;
        }

        .btn-next {
            background: var(--pop);
            color: #fff;
            box-shadow: 0 4px 0 var(--pop-deep);
        }

        button:hover {
            filter: brightness(1.04);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent !important;
        }

        @media (max-width: 350px) {
            .meaning-badge {
                font-size: 1.15rem;
            }

            #writer-container {
                width: 86vw;
                height: 86vw;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            .status-chip.pop {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand-row">
            <span class="kanji-mark">書</span>
            <span class="brand-text">ฝึกลำดับขีดคันจิ</span>
        </div>
        <div class="progress-row">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-count" id="progress-count">0/0</span>
        </div>
        <div class="nav-container">
            <div class="select-group">
                <label for="setSelect">ชุดคำศัพท์</label>
                <select id="setSelect" onchange="loadSet(this.value)"></select>
            </div>
            <div class="select-group">
                <label for="kanjiSelect">เลือกคำ</label>
                <select id="kanjiSelect" onchange="loadWord(this.value)"></select>
            </div>
        </div>
    </header>

    <main>
        <div class="card" id="practice-card">
            <div class="info-section">
                <span class="meaning-badge" id="display-meaning">...</span>
                <span class="reading-hint" id="display-reading">...</span>
            </div>

            <div id="writer-container"></div>

            <div class="status-chip state-neutral" id="status-msg">พร้อมแล้วหรือยัง?</div>

            <div class="actions">
                <button class="btn-prev" onclick="prevInSet()" aria-label="คำก่อนหน้า">
                    <span>←</span>
                </button>
                <button class="btn-hint" onclick="if(writer) writer.animateCharacter()">
                    <span>筆</span> ลำดับขีด
                </button>
                <button class="btn-next" id="next-btn" onclick="nextInSet()">
                    ข้ามคำนี้ <span>→</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const defaultData = {
            "ชุดคำศัพท์พื้นฐาน": [
                { "char": "学校", "data1": "がっこう", "mean": "โรงเรียน" },
                { "char": "先生", "data1": "せんせい", "mean": "คุณครู" },
                { "char": "水", "data1": "みず", "mean": "น้ำ" },
                { "char": "食べる", "data1": "たべる", "mean": "กิน" },
                { "char": "歩く", "data1": "あるく", "mean": "เดิน" },
                { "char": "悪い", "data1": "わるい", "mean": "เลว/แย่" }
            ],
            "ตัวเลข": [
                { "char": "一", "data1": "いち", "mean": "หนึ่ง" },
                { "char": "二", "data1": "に", "mean": "สอง" },
                { "char": "三", "data1": "さん", "mean": "สาม" },
                { "char": "四", "data1": "よん", "mean": "สี่" },
                { "char": "五", "data1": "ご", "mean": "ห้า" }
            ]
        };

        let kanjiDataSets = {};
        let writer;
        let currentSetName = "";
        let currentWordIdx = 0;
        let currentCharInWordIdx = 0;
        let isWordComplete = false;
        let autoAdvanceTimer;

        /**
         * ตัวโหลดข้อมูลตัวอักษรที่ได้รับการปรับปรุง:
         * 1. ลองโหลดจากฐานข้อมูลคันจิญี่ปุ่น (jp) ก่อน
         * 2. หากไม่พบ (404) จะลองโหลดจากฐานข้อมูลหลัก (cn/default)
         * 3. หากไม่พบอีก จะแจ้ง Error ผ่าน Console เพื่อไม่ให้แอปค้าง
         */
        const charDataLoader = (char, onComplete, onErr) => {
            fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@latest/${char}.json`)
                .then(res => {
                    if (!res.ok) throw new Error('Not found in JP db');
                    return res.json();
                })
                .then(onComplete)
                .catch(() => {
                    fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/${char}.json`)
                        .then(res => {
                            if (!res.ok) throw new Error('Not found in any db');
                            return res.json();
                        })
                        .then(onComplete)
                        .catch(err => {
                            console.error('ไม่พบข้อมูลสำหรับตัวอักษร:', char);
                            if (onErr) onErr(err);
                        });
                });
        };

        async function fetchKanjiData() {
            try {
                const response = await fetch('data_kanji.json').catch(() => null);
                kanjiDataSets = (response && response.ok) ? await response.json() : defaultData;
                initApp();
            } catch (e) {
                kanjiDataSets = defaultData;
                initApp();
            }
        }

        function initApp() {
            const setSelect = document.getElementById('setSelect');
            const setNames = Object.keys(kanjiDataSets);
            setSelect.innerHTML = setNames.map(name => {
                const currentSet = kanjiDataSets[name];
                const charList = currentSet.map(item => item.char);
                const charString = charList.join(' ');
                return `<option value="${name}">${name}: ${charString}</option>`;
            }).join('');
            if (setNames.length > 0) loadSet(setNames[0]);
        }

        function loadSet(setName) {
            currentSetName = setName;
            const kanjiSelect = document.getElementById('kanjiSelect');
            kanjiSelect.innerHTML = kanjiDataSets[setName].map((item, i) =>
                `<option value="${i}">${item.char} - ${item.mean}</option>`
            ).join('');
            loadWord(0);
        }

        function loadWord(index) {
            clearTimeout(autoAdvanceTimer);
            currentWordIdx = parseInt(index);
            currentCharInWordIdx = 0;
            isWordComplete = false;
            const data = kanjiDataSets[currentSetName][currentWordIdx];

            document.getElementById('display-meaning').innerText = data.mean;
            document.getElementById('display-reading').innerText = data.data1;
            document.getElementById('kanjiSelect').value = index;
            document.getElementById('next-btn').innerHTML = 'ข้ามคำนี้ <span>→</span>';

            updateProgress();
            setupWriterForChar();
        }

        function updateProgress() {
            const set = kanjiDataSets[currentSetName];
            const total = set.length;
            const pct = total > 0 ? ((currentWordIdx + 1) / total) * 100 : 0;
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-count').innerText = `${currentWordIdx + 1}/${total}`;
        }

        function setStatus(text, state) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.className = 'status-chip state-' + state;
            void msg.offsetWidth;
            msg.classList.add('pop');
        }

        function setupWriterForChar() {
            const data = kanjiDataSets[currentSetName][currentWordIdx];
            const charToDraw = data.char[currentCharInWordIdx];
            const container = document.getElementById('writer-container');

            if (writer && typeof writer.cancelQuiz === 'function') {
                try { writer.cancelQuiz(); } catch (e) { /* no active quiz to cancel */ }
            }
            container.innerHTML = '';

            const isKanji = /[\u4e00-\u9faf]/.test(charToDraw);
            if (!isKanji) {
                if (currentCharInWordIdx < data.char.length - 1) {
                    currentCharInWordIdx++;
                    setupWriterForChar();
                } else {
                    handleWordComplete();
                }
                return;
            }

            const size = Math.min(container.clientWidth - 10, 320);

            writer = HanziWriter.create('writer-container', charToDraw, {
                width: size,
                height: size,
                showCharacter: false,
                showOutline: true,
                drawingColor: '#2b2140',
                outlineColor: 'rgba(43, 33, 64, 0)',
                drawingWidth: 18,
                padding: 22,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 100,
                charDataLoader: charDataLoader
            });

            startQuiz();
        }

        function startQuiz() {
            if (!writer) return;
            const data = kanjiDataSets[currentSetName][currentWordIdx];
            const totalChars = data.char.length;

            setStatus(
                totalChars > 1 ? `เขียนตัวที่ ${currentCharInWordIdx + 1} / ${totalChars}` : "ลากเส้นตามลำดับขีด",
                'neutral'
            );

            writer.quiz({
                onMistake: () => {
                    setStatus("ผิด! ลองใหม่อีกครั้ง", 'error');
                },
                onCorrectStroke: () => {
                    setStatus("ถูกต้อง! ต่อไป...", 'success');
                },
                onComplete: () => {
                    let nextIdx = currentCharInWordIdx + 1;
                    while (nextIdx < data.char.length && !/[\u4e00-\u9faf]/.test(data.char[nextIdx])) {
                        nextIdx++;
                    }

                    if (nextIdx < data.char.length) {
                        setStatus("ยอดเยี่ยม! ไปตัวถัดไป...", 'info');
                        setTimeout(() => {
                            currentCharInWordIdx = nextIdx;
                            setupWriterForChar();
                        }, 800);
                    } else {
                        handleWordComplete();
                    }
                }
            });
        }

        function handleWordComplete() {
            isWordComplete = true;
            setStatus("เขียนครบทั้งคำแล้ว ✓", 'success');
            document.getElementById('next-btn').innerHTML = 'คำถัดไป <span>→</span>';

            // deferred to the next tick so the mouseup/touchend that just completed
            // the last stroke finishes processing before we mutate the writer's DOM
            const completedWriter = writer;
            setTimeout(() => {
                if (completedWriter) {
                    completedWriter.showCharacter();
                    completedWriter.updateColor('drawingColor', { color: '#3eaa5c', duration: 300 });
                }
            }, 0);

            const set = kanjiDataSets[currentSetName];
            if (set.length > 1) {
                autoAdvanceTimer = setTimeout(nextInSet, 1000);
            }
        }

        function prevInSet() {
            const set = kanjiDataSets[currentSetName];
            currentWordIdx = (currentWordIdx - 1 + set.length) % set.length;
            loadWord(currentWordIdx);
        }

        function nextInSet() {
            const set = kanjiDataSets[currentSetName];
            currentWordIdx = (currentWordIdx + 1) % set.length;
            loadWord(currentWordIdx);
        }

        window.onload = fetchKanjiData;
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (writer) setupWriterForChar();
            }, 300);
        });
    </script>

</body>

</html>
