<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ฝึกเขียนคันจิ</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* washi paper + sumi ink + hanko red */
            --paper: #f3ede0;
            --paper-deep: #e9e0cd;
            --sumi: #24211c;
            --sumi-soft: #5b564c;
            --hanko: #b3401f;
            --hanko-deep: #8f2f16;
            --indigo: #2d4356;
            --moss: #5c6e4f;
            --line: #cdc2a6;
            --card: #faf6ec;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(179, 64, 31, 0.05), transparent 40%),
                radial-gradient(circle at 88% 92%, rgba(45, 67, 86, 0.06), transparent 42%),
                var(--paper);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--sumi);
        }

        header {
            background: var(--paper);
            padding: 14px 16px 12px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-row {
            max-width: 460px;
            margin: 0 auto 12px;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .brand-row .kanji-mark {
            font-family: 'Noto Serif JP', serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--hanko);
            line-height: 1;
        }

        .brand-row .brand-text {
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            color: var(--sumi-soft);
        }

        .nav-container {
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .select-group label {
            font-size: 0.78rem;
            font-weight: 600;
            min-width: 74px;
            color: var(--sumi-soft);
        }

        select {
            flex: 1;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            background: var(--card);
            color: var(--sumi);
            outline: none;
            cursor: pointer;
        }

        select:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--indigo);
            outline-offset: 2px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 14px 28px;
        }

        .card {
            background: var(--card);
            width: 100%;
            max-width: 440px;
            padding: 26px 20px 22px;
            border-radius: 14px;
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(36, 33, 28, 0.04), 0 12px 28px -18px rgba(36, 33, 28, 0.35);
            text-align: center;
        }

        .info-section {
            margin-bottom: 16px;
        }

        .meaning-badge {
            display: inline-block;
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--sumi);
            font-weight: 700;
            font-size: 1.5rem;
            border-bottom: 3px solid var(--hanko);
            padding-bottom: 3px;
        }

        .reading-hint {
            display: block;
            font-family: 'Noto Serif JP', serif;
            font-size: 1.05rem;
            color: var(--sumi-soft);
            margin-top: 8px;
        }

        /* genkouyoushi manuscript-paper grid: thematically the real writing grid, not decoration */
        #writer-container {
            width: 82vw;
            height: 82vw;
            max-width: 340px;
            max-height: 340px;
            margin: 0 auto 18px auto;
            background: #fffdf8;
            border: 1.5px solid var(--sumi);
            border-radius: 4px;
            position: relative;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #writer-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(90deg, transparent 49.4%, var(--line) 50%, transparent 50.6%),
                linear-gradient(180deg, transparent 49.4%, var(--line) 50%, transparent 50.6%),
                linear-gradient(45deg, transparent 49.7%, rgba(205, 194, 166, 0.55) 50%, transparent 50.3%),
                linear-gradient(-45deg, transparent 49.7%, rgba(205, 194, 166, 0.55) 50%, transparent 50.3%);
            pointer-events: none;
            z-index: 0;
        }

        #writer-container svg {
            position: relative;
            z-index: 1;
        }

        .status-bar {
            height: 22px;
            font-family: 'Noto Sans Thai', sans-serif;
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 16px;
            transition: color 0.2s;
        }

        .actions {
            display: grid;
            grid-template-columns: auto 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: filter 0.15s, transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .btn-hint {
            background: var(--paper-deep);
            color: var(--sumi);
            border: 1px solid var(--line);
        }

        .btn-prev {
            background: var(--paper-deep);
            color: var(--indigo);
            border: 1px solid var(--line);
            padding-left: 14px;
            padding-right: 14px;
        }

        .btn-next {
            background: var(--hanko);
            color: #fdf6ec;
        }

        button:hover {
            filter: brightness(1.04);
        }

        button:active {
            transform: translateY(1px);
            filter: brightness(0.94);
        }

        @media (max-width: 350px) {
            .meaning-badge {
                font-size: 1.25rem;
            }

            #writer-container {
                width: 88vw;
                height: 88vw;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand-row">
            <span class="kanji-mark">書</span>
            <span class="brand-text">ฝึกลำดับขีดคันจิ</span>
        </div>
        <div class="nav-container">
            <div class="select-group">
                <label for="setSelect">ชุดคำศัพท์</label>
                <select id="setSelect" onchange="loadSet(this.value)"></select>
            </div>
            <div class="select-group">
                <label for="kanjiSelect">เลือกคำ</label>
                <select id="kanjiSelect" onchange="loadWord(this.value)"></select>
            </div>
        </div>
    </header>

    <main>
        <div class="card" id="practice-card">
            <div class="info-section">
                <span class="meaning-badge" id="display-meaning">...</span>
                <span class="reading-hint" id="display-reading">...</span>
            </div>

            <div id="writer-container"></div>

            <div class="status-bar" id="status-msg">พร้อมแล้วหรือยัง?</div>

            <div class="actions">
                <button class="btn-prev" onclick="prevInSet()" aria-label="คำก่อนหน้า">
                    <span>←</span>
                </button>
                <button class="btn-hint" onclick="if(writer) writer.animateCharacter()">
                    <span>筆</span> ลำดับขีด
                </button>
                <button class="btn-next" id="next-btn" onclick="nextInSet()">
                    ข้ามคำนี้ <span>→</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const defaultData = {
            "ชุดคำศัพท์พื้นฐาน": [
                { "char": "学校", "data1": "がっこう", "mean": "โรงเรียน" },
                { "char": "先生", "data1": "せんせい", "mean": "คุณครู" },
                { "char": "水", "data1": "みず", "mean": "น้ำ" },
                { "char": "食べる", "data1": "たべる", "mean": "กิน" },
                { "char": "歩く", "data1": "あるく", "mean": "เดิน" },
                { "char": "悪い", "data1": "わるい", "mean": "เลว/แย่" }
            ],
            "ตัวเลข": [
                { "char": "一", "data1": "いち", "mean": "หนึ่ง" },
                { "char": "二", "data1": "に", "mean": "สอง" },
                { "char": "三", "data1": "さん", "mean": "สาม" },
                { "char": "四", "data1": "よん", "mean": "สี่" },
                { "char": "五", "data1": "ご", "mean": "ห้า" }
            ]
        };

        let kanjiDataSets = {};
        let writer;
        let currentSetName = "";
        let currentWordIdx = 0;
        let currentCharInWordIdx = 0;
        let isWordComplete = false;
        let autoAdvanceTimer;

        /**
         * ตัวโหลดข้อมูลตัวอักษรที่ได้รับการปรับปรุง:
         * 1. ลองโหลดจากฐานข้อมูลคันจิญี่ปุ่น (jp) ก่อน
         * 2. หากไม่พบ (404) จะลองโหลดจากฐานข้อมูลหลัก (cn/default)
         * 3. หากไม่พบอีก จะแจ้ง Error ผ่าน Console เพื่อไม่ให้แอปค้าง
         */
        const charDataLoader = (char, onComplete, onErr) => {
            fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@latest/${char}.json`)
                .then(res => {
                    if (!res.ok) throw new Error('Not found in JP db');
                    return res.json();
                })
                .then(onComplete)
                .catch(() => {
                    fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/${char}.json`)
                        .then(res => {
                            if (!res.ok) throw new Error('Not found in any db');
                            return res.json();
                        })
                        .then(onComplete)
                        .catch(err => {
                            console.error('ไม่พบข้อมูลสำหรับตัวอักษร:', char);
                            if (onErr) onErr(err);
                        });
                });
        };

        async function fetchKanjiData() {
            try {
                const response = await fetch('data_kanji.json').catch(() => null);
                kanjiDataSets = (response && response.ok) ? await response.json() : defaultData;
                initApp();
            } catch (e) {
                kanjiDataSets = defaultData;
                initApp();
            }
        }

        function initApp() {
            const setSelect = document.getElementById('setSelect');
            const setNames = Object.keys(kanjiDataSets);
            setSelect.innerHTML = setNames.map(name => {
                const currentSet = kanjiDataSets[name];
                const charList = currentSet.map(item => item.char);
                const charString = charList.join(' ');
                return `<option value="${name}">${name}: ${charString}</option>`;
            }).join('');
            if (setNames.length > 0) loadSet(setNames[0]);
        }

        function loadSet(setName) {
            currentSetName = setName;
            const kanjiSelect = document.getElementById('kanjiSelect');
            kanjiSelect.innerHTML = kanjiDataSets[setName].map((item, i) =>
                `<option value="${i}">${item.char} - ${item.mean}</option>`
            ).join('');
            loadWord(0);
        }

        function loadWord(index) {
            clearTimeout(autoAdvanceTimer);
            currentWordIdx = parseInt(index);
            currentCharInWordIdx = 0;
            isWordComplete = false;
            const data = kanjiDataSets[currentSetName][currentWordIdx];

            document.getElementById('display-meaning').innerText = data.mean;
            document.getElementById('display-reading').innerText = data.data1;
            document.getElementById('kanjiSelect').value = index;
            document.getElementById('next-btn').innerHTML = 'ข้ามคำนี้ <span>→</span>';

            setupWriterForChar();
        }

        function setupWriterForChar() {
            const data = kanjiDataSets[currentSetName][currentWordIdx];
            const charToDraw = data.char[currentCharInWordIdx];
            const container = document.getElementById('writer-container');
            container.innerHTML = '';

            const isKanji = /[\u4e00-\u9faf]/.test(charToDraw);
            if (!isKanji) {
                if (currentCharInWordIdx < data.char.length - 1) {
                    currentCharInWordIdx++;
                    setupWriterForChar();
                } else {
                    handleWordComplete();
                }
                return;
            }

            const size = Math.min(container.clientWidth - 10, 340);

            writer = HanziWriter.create('writer-container', charToDraw, {
                width: size,
                height: size,
                showCharacter: false,
                showOutline: true,
                drawingColor: '#24211c',
                outlineColor: 'rgba(0, 0, 0, 0)',
                drawingWidth: 18,
                padding: 22,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 100,
                charDataLoader: charDataLoader
            });

            startQuiz();
        }

        function startQuiz() {
            if (!writer) return;
            const msg = document.getElementById('status-msg');
            const data = kanjiDataSets[currentSetName][currentWordIdx];
            const totalChars = data.char.length;

            msg.innerText = totalChars > 1
                ? `เขียนตัวที่ ${currentCharInWordIdx + 1} / ${totalChars}`
                : "ลากเส้นตามลำดับขีด";
            msg.style.color = "var(--sumi-soft)";

            writer.quiz({
                onMistake: () => {
                    msg.innerText = "ผิด! ลองใหม่อีกครั้ง";
                    msg.style.color = "var(--hanko-deep)";
                },
                onCorrectStroke: () => {
                    msg.innerText = "ถูกต้อง! ต่อไป...";
                    msg.style.color = "var(--moss)";
                },
                onComplete: () => {
                    let nextIdx = currentCharInWordIdx + 1;
                    while (nextIdx < data.char.length && !/[\u4e00-\u9faf]/.test(data.char[nextIdx])) {
                        nextIdx++;
                    }

                    if (nextIdx < data.char.length) {
                        msg.innerText = "ยอดเยี่ยม! ไปตัวถัดไป...";
                        msg.style.color = "var(--indigo)";
                        setTimeout(() => {
                            currentCharInWordIdx = nextIdx;
                            setupWriterForChar();
                        }, 800);
                    } else {
                        handleWordComplete();
                    }
                }
            });
        }

        function handleWordComplete() {
            const msg = document.getElementById('status-msg');
            isWordComplete = true;
            msg.innerText = "เขียนครบทั้งคำแล้ว ✓";
            msg.style.color = "var(--moss)";

            document.getElementById('next-btn').innerHTML = 'คำถัดไป <span>→</span>';
            if (writer) writer.showCharacter();

            const set = kanjiDataSets[currentSetName];
            if (set.length > 1) {
                autoAdvanceTimer = setTimeout(nextInSet, 1000);
            }
        }

        function prevInSet() {
            const set = kanjiDataSets[currentSetName];
            currentWordIdx = (currentWordIdx - 1 + set.length) % set.length;
            loadWord(currentWordIdx);
        }

        function nextInSet() {
            const set = kanjiDataSets[currentSetName];
            currentWordIdx = (currentWordIdx + 1) % set.length;
            loadWord(currentWordIdx);
        }

        window.onload = fetchKanjiData;
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (writer) setupWriterForChar();
            }, 300);
        });
    </script>

</body>

</html>
