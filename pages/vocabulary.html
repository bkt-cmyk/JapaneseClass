<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hiragana Typing</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/vocabulary.css">
</head>
<body>

<header>
    <div class="nav-container">
        <div class="select-group">
            <label>ชุดคำศัพท์:</label>
            <select id="setSelect" onchange="loadSet(this.value)"></select>
        </div>
        <div class="select-group">
            <label>เลือกคำ:</label>
            <select id="kanjiSelect" onchange="loadWord(this.value)"></select>
        </div>
    </div>
</header>

<main>
    <div class="card" id="practice-card">
        <div class="info-section">
            <div class="reading-hint">คำศัพท์นี้คืออะไร?</div>
            <span class="meaning-badge" id="display-meaning">...</span>
        </div>

        <div class="input-section">
            <input type="text" id="answer-input" autocomplete="off" placeholder="答えは？" autofocus>
            <div id="revealed-hint" class="hidden-hint"></div>
        </div>

        <div class="actions">
            <button class="btn-check" id="check-btn" onclick="handleMainAction()">
                ตรวจสอบคำตอบ (Enter)
            </button>
            <button class="btn-hint" onclick="showHint()">
                <span>💡</span> เฉลย
            </button>
            <button class="btn-next" onclick="nextInSet()">
                ข้ามคำนี้ <span>➔</span>
            </button>
        </div>
    </div>
</main>

<script src="../assets/js/vocabulary.js"></script>

</body>
</html>
